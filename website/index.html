<head>
    <meta charset="UFT-8">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="title">
        <div class="title-text">
            <h1>Management Portal</h1>
            <p>Ubuntu-Homeserver · Systemverwaltung</p>
        </div>

        <div class="title-icons">
            <img src="https://skillicons.dev/icons?i=linux,ubuntu,py" alt="Technologien">
        </div>
    </div>
    
    <div id="warnings"></div>
    
    <div class="card-list">
        <div class="card">
            <h2>RAM</h2>
            <p id="ram_free">RAM Free: </p>
            <p id="ram_used">RAM Used: </p>

            <div class="progress">
                <div id="bar_ram"  class="progress-bar green"></div>
            </div>
        </div>

        <div class="card">
            <h2>CPU</h2>
            <p id="cpu_usage">CPU usage:.... </p>
            
            <div class="progress">
                <div id="bar_cpu" class="progress-bar green"></div>
            </div>
        </div>

        <div class="card">
            <h2>DISK</h2>
            <p id="disk_free">Disk Free: </p>
            <p id="disk_percent">Disk Percent: </p>
            <p id="disk_usage">Disk Usage: </p>

            <div class="progress">
                <div id="bar_disk"  class="progress-bar green"></div>
            </div>
        </div>
        
        <div class="card">
            <h2>UPTIME</h2>
            <p id="uptime">Uptime Seconds: </p>
        </div>
        
        <div class="card">
            <h2>NETWORK</h2>
            <p id="upload_speed">Upload Speed: </p>
            <p id="download_speed">Download Speed: </p>
            <br>
            <h2>IP-Adress</h2>
            <p id="private_ip">Loading...</p>
            <p id="public_ip">Loading...</p>

        </div>
    </div>
    
    <script src="index.js"></script>
</body>
